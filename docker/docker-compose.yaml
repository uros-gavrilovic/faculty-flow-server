services:
  postgres:
    image: postgres:16
    container_name: faculty-flow-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./resources/database:/docker-entrypoint-initdb.d
    ports:
      - "8080:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: faculty-flow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,kafka.server=WARN,org.apache.kafka=WARN"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  faculty-flow-gateway:
    build:
      context: ../faculty-flow-gateway
    image: faculty-flow-gateway:latest
    container_name: faculty-flow-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
#    depends_on:
#      - faculty-flow-user
#      - faculty-flow-room
    ports:
      - "9000:8080"

  faculty-flow-user:
    build:
      context: ../faculty-flow-user
    image: faculty-flow-user:latest
    container_name: faculty-flow-user
#    depends_on:
#      postgres:
#        condition: service_healthy

  faculty-flow-reservation:
    build:
      context: ../faculty-flow-reservation
    image: faculty-flow-reservation:latest
    container_name: faculty-flow-reservation
#    depends_on:
#      postgres:
#        condition: service_healthy

  faculty-flow-room:
    build:
      context: ../faculty-flow-room
    image: faculty-flow-room:latest
    container_name: faculty-flow-room
#    depends_on:
#      postgres:
#        condition: service_healthy

  faculty-flow-mail:
    build:
      context: ../faculty-flow-mail
    image: faculty-flow-mail:latest
    container_name: faculty-flow-mail

volumes:
  pg_data:
